<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ArthaKavach Firewall</title>
  <style>
    body {
      font-family: sans-serif;
      width: 240px;
      padding: 14px;
      margin: 0;
      color: #293241;
      background: #F3F8FA;
    }
    h3 {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 700;
      color: #1F2633;
    }
    p {
      margin: 0 0 10px;
      font-size: 11px;
      color: #5C6B7E;
      line-height: 1.4;
    }
    .badge-row {
      display: flex;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 4px;
      background: #E0FBFC;
      color: #3D5A80;
      border: 1px solid #98C1D9;
    }
  </style>
</head>
<body>
  <h3>ArthaKavach Firewall</h3>
  <p>Enforces server-authoritative trading loss protection across Kite Zerodha and Angel One.</p>
  <div class="badge-row">
    <span class="badge">Zerodha Active</span>
    <span class="badge">Angel One Active</span>
  </div>
</body>
</html>
