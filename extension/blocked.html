<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trading Firewall Locked</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F3F8FA;
      color: #293241;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border: 2px solid #E54B4B20;
      box-shadow: 0 10px 25px -5px rgba(41, 50, 65, 0.08);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 40px;
      text-align: center;
      box-sizing: border-box;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #E54B4B15;
      color: #E54B4B;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 12px;
      letter-spacing: -0.5px;
      color: #1F2633;
    }
    p {
      font-size: 14px;
      color: #5C6B7E;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .lock-time-box {
      background: #F3F8FA;
      border: 1px dashed #98C1D9;
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-weight: bold;
      font-size: 13px;
      color: #3D5A80;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #3D5A80;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #293241;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1 id="title">Trading Firewall Locked</h1>
    <p id="description">Trading access in MonkTrades is restricted until the circuit breaker lockout has elapsed.</p>
    
    <div class="lock-time-box" id="lock-time">
      Checking lock status...
    </div>

    <a href="#" class="btn" id="btn-back">Go to MonkTrades Dashboard</a>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
